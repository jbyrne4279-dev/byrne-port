name: Daily News Briefing

on:
  schedule:
    # Every 3 hours. GitHub can delay or skip scheduled runs, so frequent
    # runs keep the briefing fresh even when one is missed.
    - cron: '17 */3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: news-briefing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build news-data.json (The Brief)
        run: node tools/build-news.mjs
        continue-on-error: true

      - name: Build home-brief-data.json (The Home Brief)
        run: node tools/build-home-brief.mjs
        continue-on-error: true

      - name: Commit if changed
        run: |
          git config user.name "news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news-data.json home-brief-data.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(news): daily briefing refresh"
            git push
          else
            echo "No changes to the briefings"
          fi
