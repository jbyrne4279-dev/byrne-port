name: Daily News Briefing

on:
  schedule:
    # Every 3 hours. GitHub can delay or skip scheduled runs, so frequent
    # runs keep the briefing fresh even when one is missed.
    - cron: '17 */3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: news-briefing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build news-data.json
        run: node tools/build-news.mjs

      - name: Commit if changed
        run: |
          git config user.name "news-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- news-data.json; then
            git add news-data.json
            git commit -m "chore(news): daily briefing refresh"
            git push
          else
            echo "No changes to news-data.json"
          fi
