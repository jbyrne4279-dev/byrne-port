<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <!-- Save to home screen and it opens full-screen like an app -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="My Week">

  <title>My Week | Joseph Byrne</title>
  <meta name="description" content="Joe's weekly timetable.">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230a0a0a'/%3E%3Ctext x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' font-family='Helvetica,Arial,sans-serif' font-weight='700' font-size='34' fill='%23ff002e'%3EJB%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="schedule.css?v=4">
</head>
<body class="is-locked">
  <!-- Passcode screen -->
  <section class="sc-lock" id="scLock" hidden aria-labelledby="scLockTitle">
    <div class="sc-lock__inner">
      <svg class="sc-lock__icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      <h1 class="sc-lock__title" id="scLockTitle">Enter passcode</h1>
      <div class="sc-dots" id="scDots" aria-hidden="true"></div>
      <p class="sc-lock__msg" id="scLockMsg" role="status" aria-live="assertive"></p>
      <p class="sc-sr" id="scLockSR" aria-live="polite"></p>
      <div class="sc-pad" id="scPad" aria-label="Number pad">
        <button type="button" data-k="1">1</button>
        <button type="button" data-k="2">2</button>
        <button type="button" data-k="3">3</button>
        <button type="button" data-k="4">4</button>
        <button type="button" data-k="5">5</button>
        <button type="button" data-k="6">6</button>
        <button type="button" data-k="7">7</button>
        <button type="button" data-k="8">8</button>
        <button type="button" data-k="9">9</button>
        <span aria-hidden="true"></span>
        <button type="button" data-k="0">0</button>
        <button type="button" data-k="del" class="sc-pad__del" aria-label="Delete">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="M17 9l-6 6M11 9l6 6"/></svg>
        </button>
      </div>
      <a class="sc-lock__back" href="/">Back to portfolio</a>
    </div>
  </section>

  <main class="sc" id="scApp" hidden>
    <header class="sc-head">
      <div>
        <p class="sc-head__date" id="scDate"></p>
        <h1 class="sc-head__title" tabindex="-1">My week</h1>
      </div>
      <button type="button" class="sc-head__lock" id="scLockBtn" aria-label="Lock timetable on this device">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        Lock
      </button>
    </header>

    <section class="sc-now" id="scNow" aria-label="Now and next"></section>
    <p class="sc-sr" id="scStatus" role="status" aria-live="polite"></p>

    <div class="sc-seg" role="group" aria-label="View">
      <button type="button" id="scViewDay" aria-pressed="true">Day</button>
      <button type="button" id="scViewWeek" aria-pressed="false">Week</button>
    </div>

    <div id="scDayPane">
      <nav class="sc-strip" id="scStrip" role="tablist" aria-label="Choose a day"></nav>
      <section class="sc-agenda" id="scAgenda" role="tabpanel"></section>
      <p class="sc-hint">Swipe left or right to change day</p>
    </div>

    <div id="scWeekPane" hidden>
      <div class="sc-week" id="scWeek"></div>
    </div>

    <section class="sc-totals-wrap" aria-labelledby="scTotalsTitle">
      <h2 class="sc-section-title" id="scTotalsTitle">Hours this week</h2>
      <ul class="sc-totals" id="scTotals"></ul>
    </section>
  </main>

  <script src="schedule-vault.js?v=1"></script>
  <script src="schedule.js?v=4"></script>
</body>
</html>
