<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <defs>
    <radialGradient id="bg" cx="50%" cy="55%" r="70%"><stop offset="0" stop-color="#F2F2F4"/><stop offset="0.55" stop-color="#F8F8FA"/><stop offset="1" stop-color="#FFFFFF"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#4D4D55" stroke-opacity="0.10" stroke-width="1"/></pattern>
  </defs>
  <style>.ring{transform-box:fill-box;transform-origin:center;animation:ring 2s ease-out infinite}@keyframes ring{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.9);opacity:0}}.dot{transform-box:fill-box;transform-origin:center;animation:dot 2s ease-in-out infinite}@keyframes dot{0%,100%{transform:scale(1)}50%{transform:scale(.8)}}.ln{stroke-dasharray:100;animation:type 5s ease-in-out infinite}.ln:nth-of-type(2){animation-delay:.25s}.ln:nth-of-type(3){animation-delay:.5s}.ln:nth-of-type(4){animation-delay:.75s}@keyframes type{0%{stroke-dashoffset:100}25%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-100}}.pic{transform-box:fill-box;transform-origin:center;animation:pic 5s ease-in-out infinite}@keyframes pic{0%,20%{opacity:.35}35%,85%{opacity:1}100%{opacity:.35}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <rect x="470" y="230" width="660" height="560" rx="60" fill="#4D4D55" opacity="0.10" filter="url(#soft)"/>

  <!-- House with a vase and a hanging bauble: homeware -->
  <g filter="url(#glow)" fill="none" stroke="#4D4D55" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <path d="M520 470 L800 250 L1080 470"/>
    <path d="M580 430 V780 H1020 V430"/>
    <path class="vase" d="M700 780 c-60-40-60-130 0-170 v-50 h80 v50 c60 40 60 130 0 170 z"/>
    <line x1="900" y1="420" x2="900" y2="560"/>
  </g>
  <g class="bauble" filter="url(#glow)">
    <circle cx="900" cy="610" r="50" fill="#4D4D55"/>
    <rect x="880" y="548" width="40" height="20" rx="6" fill="#4D4D55"/>
    <circle cx="884" cy="594" r="12" fill="#FFFFFF" opacity="0.8"/>
  </g>
  <g class="spark" fill="#4D4D55">
    <path d="M1010 330 l10 24 24 10 -24 10 -10 24 -10-24 -24-10 24-10z"/>
    <path d="M620 330 l7 16 16 7 -16 7 -7 16 -7-16 -16-7 16-7z" opacity="0.7"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M520 470 L800 250 L1080 470"/>
    <path d="M580 430 V780 H1020 V430"/>
  </g>
  <style>
    .bauble{transform-box:fill-box;transform-origin:50% 0;animation:swing 2.8s ease-in-out infinite}
    @keyframes swing{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
    .spark path{transform-box:fill-box;transform-origin:center;animation:twinkle 2.2s ease-in-out infinite}
    .spark path:nth-child(2){animation-delay:-1.1s}
    @keyframes twinkle{0%,100%{transform:scale(.5);opacity:.3}50%{transform:scale(1.15);opacity:1}}
    .vase{stroke-dasharray:1200;animation:draw 5s ease-in-out infinite}
    @keyframes draw{0%{stroke-dashoffset:1200}35%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:-1200}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
</svg>
