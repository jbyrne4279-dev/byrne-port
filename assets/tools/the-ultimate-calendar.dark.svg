<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <defs>
    <radialGradient id="bg" cx="50%" cy="55%" r="70%"><stop offset="0" stop-color="#160403"/><stop offset="0.55" stop-color="#0b0202"/><stop offset="1" stop-color="#000"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#FF453A" stroke-opacity="0.08" stroke-width="1"/></pattern>
  </defs>
  <style>.d{animation:day 3.2s ease-in-out infinite}@keyframes day{0%,100%{opacity:.35}20%{opacity:1}40%{opacity:.35}}.today{transform-box:fill-box;transform-origin:center;animation:today 1.6s ease-in-out infinite}@keyframes today{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}.ring1,.ring2{transform-box:fill-box;transform-origin:50% 100%;animation:swing 3s ease-in-out infinite}.ring2{animation-delay:-1.5s}@keyframes swing{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <rect x="490" y="230" width="620" height="590" rx="60" fill="#FF453A" opacity="0.12" filter="url(#soft)"/>
  <g filter="url(#glow)" fill="none" stroke="#FF453A" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <rect x="500" y="250" width="600" height="560" rx="50"/>
    <line x1="500" y1="400" x2="1100" y2="400"/>
    <line class="ring1" x1="640" y1="190" x2="640" y2="310"/>
    <line class="ring2" x1="960" y1="190" x2="960" y2="310"/>
  </g>
  <rect x="500" y="250" width="600" height="150" rx="50" fill="#FF453A" opacity="0.22"/>
  <g fill="#FF453A" filter="url(#glow)">
    <rect class="d" style="animation-delay:0.00s" x="570" y="460" width="70" height="70" rx="14" opacity="0.55"/><rect class="d" style="animation-delay:0.18s" x="700" y="460" width="70" height="70" rx="14" opacity="0.55"/>
    <rect class="d" style="animation-delay:0.36s" x="830" y="460" width="70" height="70" rx="14" opacity="0.55"/><rect class="d" style="animation-delay:0.54s" x="960" y="460" width="70" height="70" rx="14" opacity="0.55"/>
    <rect class="d" style="animation-delay:0.72s" x="570" y="580" width="70" height="70" rx="14" opacity="0.55"/><rect class="today" x="700" y="580" width="70" height="70" rx="14" fill="#fff"/>
    <rect class="d" style="animation-delay:1.08s" x="830" y="580" width="70" height="70" rx="14" opacity="0.55"/><rect class="d" style="animation-delay:1.26s" x="960" y="580" width="70" height="70" rx="14" opacity="0.55"/>
    <rect class="d" style="animation-delay:1.44s" x="570" y="700" width="70" height="70" rx="14" opacity="0.55"/><rect class="d" style="animation-delay:1.62s" x="700" y="700" width="70" height="70" rx="14" opacity="0.55"/>
    <rect class="d" style="animation-delay:1.80s" x="830" y="700" width="70" height="70" rx="14" opacity="0.55"/>
  </g>
  <g fill="none" stroke="#FFD6D3" stroke-width="4" stroke-linecap="round">
    <rect x="500" y="250" width="600" height="560" rx="50"/>
    <line class="ring1" x1="640" y1="190" x2="640" y2="310"/><line class="ring2" x1="960" y1="190" x2="960" y2="310"/>
  </g>
</svg>
